# kitty.conf — Tu's kitty setup

# ── Theme (managed by `kitten themes`) ────────────────
# BEGIN_KITTY_THEME
# Nord
include current-theme.conf
# END_KITTY_THEME

# ── Cursor trail (Nord blaze shader) ──────────────────
# The trail must be on for the shader to draw anything.
cursor_trail 3
# Loads shaders/blaze-nord.slang from the kitty config dir (name without extension).
custom_shaders blaze-nord

# ── Layouts ───────────────────────────────────────────
# grid first = square-ish panes by default
enabled_layouts grid, vertical, stack
map ctrl+shift+g goto_layout grid

# ── macOS ─────────────────────────────────────────────
# Keep kitty running after the last window closes, so new windows open instantly.
macos_quit_when_last_window_closed no
